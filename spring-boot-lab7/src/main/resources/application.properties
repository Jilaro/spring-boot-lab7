spring.application.name=spring-boot-lab7
server.port=8080

# База данных H2 в файле testdb/university.mv.db в папке проекта
spring.datasource.url=jdbc:h2:file:./testdb/university;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Таблицы создаются скриптом schema.sql при запуске
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Thymeleaf: при разработке шаблоны перечитываются без перезапуска
spring.thymeleaf.cache=false

# Actuator: открытые эндпоинты и подробности о здоровье приложения
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Данные для /actuator/info
info.app.name=Учёт студентов и учебных групп
info.app.description=Лабораторная работа №7 по дисциплине «Технологии программирования»
info.app.author=Урабов Н.М., РИЗ-250213у
info.app.version=1.0
