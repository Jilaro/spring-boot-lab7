<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Учебные группы</title>
    <th:block th:replace="~{fragments :: styles}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: menu('groups')}"></nav>
<div class="container">
    <h3>Список учебных групп</h3>
    <hr/>
    <a th:href="@{/addGroupForm}" class="btn btn-primary mb-3">Добавить группу</a>

    <table class="table table-bordered table-striped" id="groupTable">
        <thead>
        <tr>
            <th>Группа</th>
            <th>Факультет</th>
            <th>Курс</th>
            <th>Куратор</th>
            <th>Студентов</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="group : ${groups}">
            <td th:text="${group.name}"></td>
            <td th:text="${group.faculty}"></td>
            <td th:text="${group.course}"></td>
            <td th:text="${group.curator}"></td>
            <td th:text="${studentCounts.getOrDefault(group.id, 0L)}"></td>
            <td class="text-nowrap">
                <a th:href="@{/showUpdateGroupForm(groupId=${group.id})}" class="btn btn-info btn-sm">Изменить</a>
                <a th:href="@{/deleteGroup(groupId=${group.id})}" class="btn btn-danger btn-sm ms-2"
                   onclick="return confirm('Удалить группу? Студенты останутся, но без группы.')">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<th:block th:replace="~{fragments :: table-scripts('groupTable')}"></th:block>
</body>
</html>
