<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Подключение стилей: Bootstrap 5 и DataTables -->
<th:block th:fragment="styles">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
</th:block>

<!-- Меню, общее для всех страниц; active – имя текущего раздела -->
<nav th:fragment="menu(active)" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Учёт студентов</span>
        <div class="navbar-nav">
            <a class="nav-link" th:classappend="${active == 'students'} ? 'active'" th:href="@{/list}">Студенты</a>
            <a class="nav-link" th:classappend="${active == 'groups'} ? 'active'" th:href="@{/groups}">Учебные группы</a>
            <a class="nav-link" th:href="@{/actuator/health}" target="_blank">Состояние сервиса</a>
        </div>
    </div>
</nav>

<!-- Скрипты таблицы: сортировка, поиск и постраничный вывод -->
<th:block th:fragment="table-scripts(tableId)">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script th:inline="javascript">
        $(function () {
            $('#' + /*[[${tableId}]]*/ 'table').DataTable({
                language: {url: 'https://cdn.datatables.net/plug-ins/1.13.8/i18n/ru.json'},
                columnDefs: [{orderable: false, targets: -1}]  // последний столбец с кнопками не сортируется
            });
        });
    </script>
</th:block>

</body>
</html>
